name: whos-hot-nhl

# One file for local development and production (issues #21, #23).
#   Local:      docker compose up -d --build        builds the images from source.
#   Production: docker compose --profile prod ...   pulls the images CI pushed to GHCR,
#               tagged with the commit SHA (IMAGE_TAG), and adds Caddy and Alloy.
# The server's .env sets APP_PROFILE=prod, IMAGE_TAG, DB_PASSWORD and SITE_DOMAIN; see
# infra/server/README.md.

services:
  postgres:
    # postgres:17 without gosu, running as the postgres user (infra/database/Dockerfile).
    image: ghcr.io/kyozoku-des/whos-hot-nhl-postgres:${IMAGE_TAG:-local}
    build:
      context: ./infra/database
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    environment:
      POSTGRES_DB: nhl_stats
      POSTGRES_USER: whoshot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-whoshot_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoshot -d nhl_stats"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Administrative credentials exist only in short-lived provisioning services.
  # Nothing changes the old whoshot owner/password, so older releases can roll back.
  migrate:
    image: ghcr.io/kyozoku-des/whos-hot-nhl-api:${IMAGE_TAG:-local}
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256
    build:
      context: ./backend
      target: api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-whoshot_local}
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-local},migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  db-roles:
    image: ghcr.io/kyozoku-des/whos-hot-nhl-postgres:${IMAGE_TAG:-local}
    build:
      context: ./infra/database
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    command: ["psql", "--no-psqlrc", "--set", "ON_ERROR_STOP=1", "--file", "/roles.sql"]
    environment:
      PGHOST: postgres
      PGDATABASE: nhl_stats
      PGUSER: whoshot
      PGPASSWORD: ${DB_PASSWORD:-whoshot_local}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-whoshot_api_local}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:-whoshot_ingest_local}
      APP_PROFILE: ${APP_PROFILE:-local}
    volumes:
      - ./infra/database/roles.sql:/roles.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend-api:
    image: ghcr.io/kyozoku-des/whos-hot-nhl-api:${IMAGE_TAG:-local}
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256
    build:
      context: ./backend
      target: api
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot_api
      SPRING_DATASOURCE_PASSWORD: ${API_DB_PASSWORD:-whoshot_api_local}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_READ_ONLY: "true"
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-local}
      LOG_DIRECTORY: /app/logs
    volumes:
      - ./backend/logs:/app/logs
    # Actuator on the unpublished management port. The Alpine JRE image has busybox
    # wget but no curl.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: unless-stopped

  data-job:
    image: ghcr.io/kyozoku-des/whos-hot-nhl-data-job:${IMAGE_TAG:-local}
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    build:
      context: ./backend
      target: data-job
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot_ingest
      SPRING_DATASOURCE_PASSWORD: ${INGEST_DB_PASSWORD:-whoshot_ingest_local}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: ${DATA_JOB_PROFILE:-${APP_PROFILE:-local}}
      LOG_DIRECTORY: /app/logs
      # Push metrics to the alloy service (prod profile). Off locally.
      METRICS_PUSH_ENABLED: ${METRICS_PUSH_ENABLED:-false}
    volumes:
      - ./backend/logs:/app/logs
    # The API only starts once the one-shot migration and grants have succeeded.
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    restart: unless-stopped

  # One-off historical season load. Not started by `up`; run explicitly:
  #   podman-compose run --rm -e BACKFILL_SEASON=20242025 backfill
  backfill:
    image: ghcr.io/kyozoku-des/whos-hot-nhl-data-job:${IMAGE_TAG:-local}
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    build:
      context: ./backend
      target: data-job
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles:
      - backfill
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot_ingest
      SPRING_DATASOURCE_PASSWORD: ${INGEST_DB_PASSWORD:-whoshot_ingest_local}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-local},backfill
      LOGGING_FILE_NAME: /app/logs/backfill.log
      BACKFILL_SEASON: ${BACKFILL_SEASON:-}
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    image: ghcr.io/kyozoku-des/whos-hot-nhl-frontend:${IMAGE_TAG:-local}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 128
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WEB3FORMS_ACCESS_KEY: ${VITE_WEB3FORMS_ACCESS_KEY:-}
        VITE_DONATION_URL_SEK: ${VITE_DONATION_URL_SEK:-}
        VITE_DONATION_URL_EUR: ${VITE_DONATION_URL_EUR:-}
        VITE_DONATION_URL_USD: ${VITE_DONATION_URL_USD:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # No VITE_API_BASE_URL here: Vite inlines import.meta.env at build time, so a
    # runtime env var has no effect on the already-built bundle. The app uses a
    # relative /api base and nginx proxies it to backend-api.
    environment:
      # nginx takes the client address from X-Forwarded-For only when the request
      # comes from Caddy's fixed address on the edge network (rate limiting is per
      # client). Locally nothing uses that address, so nothing is trusted.
      CADDY_TRUSTED_PROXY: ${EDGE_NET:-172.30.250}.2
    networks:
      - default
      - edge
    depends_on:
      - backend-api
    restart: unless-stopped

  # TLS and the public entry point (issue #21). Production only. Certificates live in
  # the caddy_data volume; keep it, Let's Encrypt rate-limits new certificates.
  caddy:
    image: ghcr.io/kyozoku-des/whos-hot-nhl-caddy:${IMAGE_TAG:-local}
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    build:
      context: ./caddy
    profiles:
      - prod
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Checked by the deploy script; empty here so a local `docker compose config` passes.
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${EDGE_NET:-172.30.250}.2
    depends_on:
      - frontend
    restart: unless-stopped

  # Monitoring agent (issue #70): ships host/container usage, app metrics and logs to
  # Grafana Cloud. Production only: `docker compose --profile prod up -d`.
  # See monitoring/README.md.
  alloy:
    # Distroless: same binary, entrypoint and user as the Ubuntu variant, without the
    # Ubuntu packages (and their advisories) or a shell (issue #58).
    image: grafana/alloy:v1.21.0-distroless
    profiles:
      - prod
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      # Empty values let a local `docker compose config` pass; Alloy fails on start
      # if they are missing in production.
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:-}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:-}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # Host metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /run/udev/data:/run/udev/data:ro
      # cAdvisor reads the machine ID; the distroless image has none of its own.
      - /etc/machine-id:/etc/machine-id:ro
      # Container metrics and logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # See every container's cgroup, not only its own (cgroup v2 namespaces them).
    cgroup: host
    mem_limit: 300m
    memswap_limit: 300m
    cpus: 0.5
    pids_limit: 256
    # edge: to scrape Caddy's metrics port.
    networks:
      - default
      - edge
    restart: unless-stopped

networks:
  # Caddy and what it talks to. A fixed subnet gives Caddy a fixed address (.2) for
  # nginx to trust; other containers get addresses from the upper half only, so they
  # can never take Caddy's. A second stack on the same machine (another worktree, the
  # monitoring test) needs its own EDGE_NET, e.g. 172.30.251.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_NET:-172.30.250}.0/24
          ip_range: ${EDGE_NET:-172.30.250}.128/25

volumes:
  postgres_data:
  alloy_data:
  caddy_data:
  caddy_config:
