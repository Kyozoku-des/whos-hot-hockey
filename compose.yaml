name: whos-hot-nhl

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nhl_stats
      POSTGRES_USER: whoshot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-whoshot_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoshot -d nhl_stats"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend-api:
    build:
      context: ./backend
      target: api
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-whoshot_local}
      SPRING_PROFILES_ACTIVE: local
      LOG_DIRECTORY: /app/logs
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  data-job:
    build:
      context: ./backend
      target: data-job
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-whoshot_local}
      SPRING_PROFILES_ACTIVE: ${DATA_JOB_PROFILE:-local}
      LOG_DIRECTORY: /app/logs
      # Push metrics to the alloy service (prod profile). Off locally.
      METRICS_PUSH_ENABLED: ${METRICS_PUSH_ENABLED:-false}
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-off historical season load. Not started by `up`; run explicitly:
  #   podman-compose run --rm -e BACKFILL_SEASON=20242025 backfill
  backfill:
    build:
      context: ./backend
      target: data-job
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles:
      - backfill
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-whoshot_local}
      SPRING_PROFILES_ACTIVE: local,backfill
      LOGGING_FILE_NAME: /app/logs/backfill.log
      BACKFILL_SEASON: ${BACKFILL_SEASON:-}
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WEB3FORMS_ACCESS_KEY: ${VITE_WEB3FORMS_ACCESS_KEY:-}
        VITE_DONATION_URL_SEK: ${VITE_DONATION_URL_SEK:-}
        VITE_DONATION_URL_EUR: ${VITE_DONATION_URL_EUR:-}
        VITE_DONATION_URL_USD: ${VITE_DONATION_URL_USD:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # No VITE_API_BASE_URL here: Vite inlines import.meta.env at build time, so a
    # runtime env var has no effect on the already-built bundle. The app uses a
    # relative /api base and nginx proxies it to backend-api.
    depends_on:
      - backend-api
    restart: unless-stopped

  # Monitoring agent (issue #70): ships host/container usage, app metrics and logs to
  # Grafana Cloud. Production only: `docker compose --profile prod up -d`.
  # See monitoring/README.md.
  alloy:
    image: grafana/alloy:v1.20.1
    profiles:
      - prod
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      # Empty values let a local `docker compose config` pass; Alloy fails on start
      # if they are missing in production.
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:-}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:-}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # Host metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /run/udev/data:/run/udev/data:ro
      # Container metrics and logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # See every container's cgroup, not only its own (cgroup v2 namespaces them).
    cgroup: host
    mem_limit: 300m
    restart: unless-stopped

volumes:
  postgres_data:
  alloy_data:
