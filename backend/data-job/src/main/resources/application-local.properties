# Run packaged applications from backend/; override the path for IDE/Maven runs.
spring.config.import=optional:file:${BACKEND_ENV_FILE:./.env}[.properties]

logging.file.name=${LOG_DIRECTORY:./logs}/data-job.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.logback.rollingpolicy.clean-history-on-start=true
