spring.application.name=nhl-data-job
spring.profiles.default=local

# Development defaults; the prod profile requires explicit connection settings.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nhl_stats}
spring.datasource.username=${DB_USER:whoshot}
spring.datasource.password=${DB_PASSWORD:whoshot_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# Jackson: Boot 4 moved to Jackson 3. Keep Jackson 2 era defaults (property order, date
# handling, lenient primitives) so JSON contracts and NHL API parsing stay unchanged.
spring.jackson.use-jackson2-defaults=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable web server (data-job doesn't serve HTTP)
spring.main.web-application-type=none

# NHL API Configuration
nhle.api.base-url=https://api-web.nhle.com
nhle.api.alternate-base-url=https://api.nhle.com

# Historical season backfill (activated via the "backfill" profile)
backfill.season=
backfill.request-delay-ms=100
backfill.dry-run=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
