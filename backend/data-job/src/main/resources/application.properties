# SQLite Database Configuration
app.sqlite.path=./nhl_stats.db

spring.datasource.url=jdbc:sqlite:${app.sqlite.path}?busy_timeout=30000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# NHL API Configuration
nhle.api.base-url=https://api-web.nhle.com
nhle.api.alternate-base-url=https://api.nhle.com