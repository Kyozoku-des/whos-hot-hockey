# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nhl_stats
spring.datasource.username=whoshot
spring.datasource.password=whoshot
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable web server (data-job doesn't serve HTTP)
spring.main.web-application-type=none

# NHL API Configuration
nhle.api.base-url=https://api-web.nhle.com
nhle.api.alternate-base-url=https://api.nhle.com
