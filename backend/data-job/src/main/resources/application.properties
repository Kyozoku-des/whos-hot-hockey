spring.application.name=nhl-data-job
spring.profiles.default=local

# Development defaults; the prod profile requires explicit connection settings.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nhl_stats}
spring.datasource.username=${DB_USER:whoshot}
spring.datasource.password=${DB_PASSWORD:whoshot_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# Jackson: Boot 4 moved to Jackson 3. Keep Jackson 2 era defaults (property order, date
# handling, lenient primitives) so JSON contracts and NHL API parsing stay unchanged.
spring.jackson.use-jackson2-defaults=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable web server (data-job doesn't serve HTTP)
spring.main.web-application-type=none

# Metrics: the job has no web server to scrape, so it pushes over OTLP to the Grafana Alloy
# agent. Off unless the deployment turns it on, so local runs don't retry a missing agent.
management.otlp.metrics.export.enabled=${METRICS_PUSH_ENABLED:false}
management.otlp.metrics.export.url=${METRICS_PUSH_URL:http://alloy:4318/v1/metrics}
management.otlp.metrics.export.step=1m
management.metrics.tags.application=${spring.application.name}
# Spring's own client metrics tag every NHL URL (one series per player/team id, up to 100
# per metric); IngestionMetrics already records those requests by endpoint category. The
# repository timers are covered by ingestion.persist.
management.metrics.enable.http.client.requests=false
management.metrics.enable.spring.data.repository.invocations=false

# NHL API Configuration
nhle.api.base-url=https://api-web.nhle.com
nhle.api.alternate-base-url=https://api.nhle.com

# Outbound request budget, shared by every request and retry in this JVM (see README).
# Conservative starting points, not a measured or NHL-approved rate.
nhle.api.requests.max-in-flight=4
nhle.api.requests.requests-per-second=10
nhle.api.requests.burst=5
nhle.api.requests.max-attempts=3
nhle.api.requests.initial-backoff=1s
nhle.api.requests.max-backoff=30s
nhle.api.requests.operation-deadline=60s
nhle.api.requests.circuit-failure-threshold=5
nhle.api.requests.circuit-open-duration=30s

# Fetch workers for initial load, live sync and backfill; 1 restores sequential fetching.
ingestion.fetch.concurrency=4
# Game-time polls reuse a player's profile for this long; every full sync refreshes it.
ingestion.player-info-cache.ttl=30m
ingestion.player-info-cache.max-entries=2000

# Historical season backfill (activated via the "backfill" profile)
backfill.season=
backfill.dry-run=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
