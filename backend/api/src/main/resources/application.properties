spring.application.name=nhl-api
spring.profiles.default=local

# Development defaults; the prod profile requires explicit connection settings.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nhl_stats}
spring.datasource.username=${DB_USER:whoshot}
spring.datasource.password=${DB_PASSWORD:whoshot_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# Jackson: Boot 4 moved to Jackson 3. Keep Jackson 2 era defaults (property order, date
# handling, lenient primitives) so JSON contracts and NHL API parsing stay unchanged.
spring.jackson.use-jackson2-defaults=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# Response Compression
# The search index (/api/search/all) is ~146 KB uncompressed and ~16 KB gzipped.
# Enabled here rather than relying on nginx: the browser may reach the API
# directly on 8080, bypassing the frontend container entirely.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# Actuator: health and Prometheus metrics on their own port, which is never published or
# proxied. Only the monitoring agent on the Docker network reaches it.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
# A few latency buckets for alerting; full histograms would multiply the metric series.
management.metrics.distribution.slo.http.server.requests=100ms,500ms,2s

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Score ticker: a player whose points per game over the last ten games is at or above this
# is highlighted as hot.
scoreboard.hot-points-per-game=1.5
