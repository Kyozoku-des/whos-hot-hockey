spring.application.name=nhl-api
spring.profiles.default=local

# Development defaults; the prod profile requires explicit connection settings.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nhl_stats}
spring.datasource.username=${DB_USER:whoshot}
spring.datasource.password=${DB_PASSWORD:whoshot_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# Jackson: Boot 4 moved to Jackson 3. Keep Jackson 2 era defaults (property order, date
# handling, lenient primitives) so JSON contracts and NHL API parsing stay unchanged.
spring.jackson.use-jackson2-defaults=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# Response Compression
# The search index (/api/search/all) is ~146 KB uncompressed and ~16 KB gzipped.
# Enabled here rather than relying on nginx: the browser may reach the API
# directly on 8080, bypassing the frontend container entirely.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
