# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nhl_stats
spring.datasource.username=whoshot
spring.datasource.password=whoshot
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Server Configuration
server.port=8080

# Response Compression
# The search index (/api/search/all) is ~146 KB uncompressed and ~16 KB gzipped.
# Enabled here rather than relying on nginx: the browser may reach the API
# directly on 8080, bypassing the frontend container entirely.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
