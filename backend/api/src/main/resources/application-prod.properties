# No development database fallback or automatic local .env import in production.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=false
spring.datasource.hikari.read-only=true

# Platform log collection will consume stdout; never install a file appender.
logging.config=classpath:logback-console.xml
management.endpoint.health.show-details=never
server.error.include-stacktrace=never

# API docs are a development aid. nginx only proxies /api/, so they are not public
# anyway; this keeps them off even on the private port.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
