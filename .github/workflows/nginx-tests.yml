name: nginx tests

on:
  pull_request:
    paths:
      - "frontend/nginx.conf"
      - "frontend/nginx/**"
      - "frontend/scripts/search-assets.js"
      - "frontend/src/router/routes.js"
      - "frontend/src/seo.js"
      - "frontend/src/themes/teamColors.js"
      - "frontend/tests/**"
      - ".github/workflows/nginx-tests.yml"
  push:
    branches: [dev, master]
    paths:
      - "frontend/nginx.conf"
      - "frontend/nginx/**"
      - "frontend/scripts/search-assets.js"
      - "frontend/src/router/routes.js"
      - "frontend/src/seo.js"
      - "frontend/src/themes/teamColors.js"
      - "frontend/tests/**"
      - ".github/workflows/nginx-tests.yml"
  # The deploy workflow runs the rate limiting tests before every deploy.
  workflow_call:

permissions:
  contents: read

jobs:
  rate-limit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Run nginx integration tests
        run: python -m unittest discover -s frontend/tests -v
