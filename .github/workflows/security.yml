name: security

# Dependency and image vulnerability scans (issue #58). Fails on any medium or higher
# finding, including those without a published fix, unless .trivyignore.yaml accepts
# that exact package version with a reason and an expiry date. Scan every Compose
# runtime image and the application build stages. Runs before every deploy and
# weekly, so new advisories and expired exceptions surface.

on:
  pull_request:
  push:
    branches: [dev]
  schedule:
    - cron: "17 5 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker compose --profile prod build --pull backend-api data-job frontend caddy
          docker build -q -t scan/api-build --target api-build backend
          docker build -q -t scan/datajob-build --target datajob-build backend
          docker build -q -t scan/frontend-build --target build frontend
          docker build -q -t scan/caddy-build --target build caddy
      - name: Inventory deployed and build images
        run: |
          mkdir -p security-reports
          {
            docker compose --profile '*' config --images
            printf '%s\n' scan/api-build scan/datajob-build scan/frontend-build scan/caddy-build
          } | sort -u > security-reports/images.txt
      - name: Scan every image, retaining all results even after a failure
        run: |
          status=0
          while IFS= read -r image; do
            report=$(printf '%s' "$image" | tr '/:' '__')
            echo "::group::$image"
            if ! docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/security-reports:/reports" -v "$PWD/.trivyignore.yaml:/policy/.trivyignore.yaml:ro" \
              -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" \
              image --scanners vuln --severity MEDIUM,HIGH,CRITICAL \
              --ignorefile /policy/.trivyignore.yaml --show-suppressed \
              --exit-code 1 --no-progress --format json --output "/reports/$report.json" "$image"; then
              status=1
            fi
            if [[ -f "security-reports/$report.json" ]]; then
              jq -r '.Results[]? | .Vulnerabilities[]? | [.Severity, .VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "unfixed")] | @tsv' \
                "security-reports/$report.json"
              echo "accepted by .trivyignore.yaml: $(jq '[.Results[]? | .ExperimentalModifiedFindings[]?] | length' "security-reports/$report.json")"
            fi
            echo "::endgroup::"
          done < security-reports/images.txt
          exit "$status"
      - name: Save image inventory and vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-image-reports
          path: security-reports/
          if-no-files-found: error
