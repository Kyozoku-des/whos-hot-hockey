name: security

# Dependency and image vulnerability scans. Fails on any medium or higher
# finding, including those without a published fix, unless the image's own policy in
# security/trivyignore/ accepts that exact package version and location with a reason
# and an expiry date. Images without a policy (the application runtime images) accept
# nothing; Caddy's only accepts unfixed go-jose v3, briefly (trivyignore.py's
# CATEGORY_EXPIRES). Scan every Compose runtime image and the application build stages. Runs
# before every deploy and weekly, so new advisories and expired exceptions surface.

on:
  pull_request:
  push:
    branches: [dev]
  schedule:
    - cron: "17 5 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Use the project's npm
        working-directory: frontend
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

  # The exception boundaries: the generator refuses findings outside its rules, and a
  # vulnerable package placed anywhere else must still fail under every policy.
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test the policy generator
        run: python3 -m unittest discover -s .github/scripts -v
      - name: Policies do not cover the same packages elsewhere
        run: |
          fixture=$(mktemp -d)
          mkdir -p "$fixture/app/node_modules/undici"
          echo '{"name": "undici", "version": "6.28.0"}' > "$fixture/app/node_modules/undici/package.json"
          (cd "$fixture" && mkdir -p META-INF/maven/org.apache.httpcomponents.client5/httpclient5 \
            && printf 'groupId=org.apache.httpcomponents.client5\nartifactId=httpclient5\nversion=5.5.1\n' \
              > META-INF/maven/org.apache.httpcomponents.client5/httpclient5/pom.properties \
            && zip -qr app/httpclient5-5.5.1.jar META-INF && rm -r META-INF)
          printf 'FROM scratch\nCOPY . /\n' | docker build -q -t scan/policy-fixture -f - "$fixture"
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security:/security:ro" \
              -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --scanners vuln \
              --severity MEDIUM,HIGH,CRITICAL --no-progress --quiet --show-suppressed --format json \
              "$@" scan/policy-fixture
          }
          # Every finding, not just the exit code: a policy suppressing one of the two
          # packages would otherwise be masked by the other still failing.
          count() { jq "[.Results[]? | .$1[]?] | length"; }
          baseline=$(scan --ignorefile "")
          packages=$(jq -r '[.Results[]? | .Vulnerabilities[]? | .PkgName] | unique | join(" ")' <<<"$baseline")
          [[ "$packages" == *httpclient5* && "$packages" == *undici* ]] \
            || { echo "::error::the fixture lacks findings ($packages), so this check would prove nothing"; exit 1; }
          expected=$(count Vulnerabilities <<<"$baseline")
          for policy in security/trivyignore/*.yaml; do
            result=$(scan --ignorefile "/$policy")
            active=$(count Vulnerabilities <<<"$result")
            suppressed=$(count ExperimentalModifiedFindings <<<"$result")
            if [[ "$suppressed" != 0 || "$active" != "$expected" ]]; then
              echo "::error::$policy suppresses $suppressed of the fixture's $expected findings outside their accepted location"
              exit 1
            fi
            echo "$policy: all $expected fixture findings still active"
          done

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker compose --profile prod build --pull postgres backend-api data-job frontend caddy
          docker build -q -t scan/api-build --target api-build backend
          docker build -q -t scan/datajob-build --target datajob-build backend
          docker build -q -t scan/frontend-build --target build frontend
          docker build -q -t scan/caddy-build --target build caddy
      - name: Inventory deployed and build images
        run: |
          mkdir -p security-reports
          {
            docker compose --profile '*' config --images
            printf '%s\n' scan/api-build scan/datajob-build scan/frontend-build scan/caddy-build
          } | sort -u > security-reports/images.txt
      - name: Scan every image, retaining all results even after a failure
        run: |
          status=0
          while IFS= read -r image; do
            report=$(printf '%s' "$image" | tr '/:' '__')
            policy="security/trivyignore/$report.yaml"
            [[ -f "$policy" ]] && ignorefile="/$policy" || ignorefile=""
            echo "::group::$image (policy: ${ignorefile:-none})"
            if ! docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/security-reports:/reports" -v "$PWD/security:/security:ro" \
              -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" \
              image --scanners vuln --severity MEDIUM,HIGH,CRITICAL \
              --ignorefile "$ignorefile" --show-suppressed \
              --exit-code 1 --no-progress --format json --output "/reports/$report.json" "$image"; then
              status=1
            fi
            if [[ -f "security-reports/$report.json" ]]; then
              jq -r '.Results[]? | .Vulnerabilities[]? | [.Severity, .VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "unfixed")] | @tsv' \
                "security-reports/$report.json"
              echo "accepted by policy:$(jq '[.Results[]? | .ExperimentalModifiedFindings[]?] | length' "security-reports/$report.json")"
            fi
            echo "::endgroup::"
          done < security-reports/images.txt
          exit "$status"
      - name: Save image inventory and vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-image-reports
          path: security-reports/
          if-no-files-found: error
