# Weekly update PRs for every dependency source (issue #58). The security workflow
# fails on vulnerable versions; these PRs keep the fixes coming.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

  # node, maven, eclipse-temurin and postgres use floating major tags that already
  # pick up patches on rebuild; a new major (non-LTS Node or JDK, a Postgres data
  # format change) is a deliberate upgrade, not a weekly bump. maven's tag encodes
  # the JDK in a suffix Dependabot does not read as a major, so skip it entirely.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: maven

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
