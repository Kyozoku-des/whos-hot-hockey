# Weekly update PRs for every dependency source (issue #58). The security workflow
# fails on vulnerable versions; these PRs keep the fixes coming.
# Majors get their own group so a green minor/patch PR is never held back by a
# breaking upgrade that CI cannot fully verify.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      maven-major:
        patterns: ["*"]
        update-types: ["major"]

  # node uses a minor tag to enforce npm's Node floor; the other runtime tags
  # float on their major. Patches arrive on rebuild and Node minor bumps via PRs.
  # A new major (non-LTS Node or JDK, a Postgres data format change) is a
  # deliberate upgrade, not a weekly bump. maven's tag encodes the JDK in a
  # suffix Dependabot does not read as a major, so skip it entirely.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: maven

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
