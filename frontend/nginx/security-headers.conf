# Included wherever add_header is used, since nginx only inherits add_header
# directives into locations that set none of their own.
#
# CSP: scripts, styles and fonts come from the bundle; the feedback form posts to
# Web3Forms. Player headshots and team logos are https URLs from the NHL API.
# Vue binds :style at runtime, so inline styles stay allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.web3forms.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
