# This file is included in the nginx http context. All workers share this zone;
# realip rewrites the key only when the immediate peer is explicitly trusted.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # No version in the Server header or on error pages.
    server_tokens off;

    # The site and its API only read. Small bodies and short waits keep slow or
    # oversized requests from tying up connections.
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json;
    # Without this nginx refuses to gzip anything it proxied, which would leave
    # the ~146 KB search index uncompressed on the /api route below.
    gzip_proxied any;

    # Proxy API calls to the backend container. Keeping the API same-origin
    # means the SPA can use a relative /api base URL, so the bundle is not
    # built against a hardcoded host and no CORS preflight is involved.
    location ^~ /api/ {
        # Allow normal page-load bursts without queueing expensive API work.
        limit_req zone=api_per_ip burst=50 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://backend-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Pass the verified client address, never an arbitrary incoming chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets. A location with its own add_header drops the server's,
    # so the security headers are included again.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Security headers. HSTS and the other HTTPS-only headers are set by Caddy.
    include /etc/nginx/security-headers.conf;
}
