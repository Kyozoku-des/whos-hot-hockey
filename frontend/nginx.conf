# This file is included in the nginx http context. All workers share this zone;
# realip rewrites the key only when the immediate peer is explicitly trusted.
# IPv4 addresses keep their own key; all IPv6 addresses in a /64 share one.
# Match binary bytes (including newlines), so compressed IPv6 spellings cannot
# create new buckets. realip supplies this value only for a trusted proxy.
map $binary_remote_addr $client_rate_key {
    default $binary_remote_addr;
    "~^(?s:(.{8}).{8})$" $1;
}
limit_req_zone $client_rate_key zone=api_per_ip:10m rate=10r/s;
limit_req_zone $client_rate_key zone=site_per_client:10m rate=30r/s;
# $server_name is fixed by this configuration, never taken from the Host header.
limit_req_zone $server_name zone=api_total:1m rate=50r/s;
limit_req_zone $server_name zone=site_total:1m rate=200r/s;
limit_conn_zone $server_name zone=site_connections:1m;

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # No version in the Server header or on error pages.
    server_tokens off;
    # Caddy emits the sanitized access record. nginx's fixed access/error formats
    # contain raw request text, so do not forward a second unsanitized copy.
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # The site and its API only read. Small bodies and short waits keep slow or
    # oversized requests from tying up connections.
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_conn site_connections 128;
    limit_conn_status 429;
    limit_req zone=site_per_client burst=100 nodelay;
    limit_req zone=site_total burst=400 nodelay;
    limit_req_status 429;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json;
    # Without this nginx refuses to gzip anything it proxied, which would leave
    # the ~146 KB search index uncompressed on the /api route below.
    gzip_proxied any;

    # Proxy API calls to the backend container. Keeping the API same-origin
    # means the SPA can use a relative /api base URL, so the bundle is not
    # built against a hardcoded host and no CORS preflight is involved.
    location ^~ /api/ {
        # Allow normal page-load bursts without queueing expensive API work.
        limit_req zone=api_per_ip burst=50 nodelay;
        # An address rotation must not create unlimited backend work. Defining
        # limits here replaces the static-route limits inherited from server.
        limit_req zone=api_total burst=100 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://backend-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Pass the verified client address, never an arbitrary incoming chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Applies the saved color scheme before first paint. Its name never changes,
    # so browsers must revalidate it instead of caching it for a year.
    location = /theme-init.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Cache static assets. A location with its own add_header drops the server's,
    # so the security headers are included again.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Security headers. HSTS and the other HTTPS-only headers are set by Caddy.
    include /etc/nginx/security-headers.conf;
}
