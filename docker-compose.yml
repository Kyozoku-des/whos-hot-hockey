services:
  postgres:
    image: postgres:16
    container_name: nhl-stats-db
    environment:
      POSTGRES_DB: nhl_stats
      POSTGRES_USER: whoshot
      POSTGRES_PASSWORD: whoshot
    ports:
      - "5432:5432"
    volumes:
      - nhl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoshot -d nhl_stats"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend
      target: api
    container_name: nhl-backend-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot
      SPRING_DATASOURCE_PASSWORD: whoshot
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  data-job:
    build:
      context: ./backend
      target: data-job
    container_name: nhl-data-job
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot
      SPRING_DATASOURCE_PASSWORD: whoshot
      SPRING_PROFILES_ACTIVE: ${DATA_JOB_PROFILE:-default}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nhl-frontend
    ports:
      - "3000:3000"
    # No VITE_API_BASE_URL here: Vite inlines import.meta.env at build time, so a
    # runtime env var has no effect on the already-built bundle. The app uses a
    # relative /api base and nginx proxies it to backend-api.
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  nhl_pgdata:
